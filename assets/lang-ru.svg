<svg xmlns="http://www.w3.org/2000/svg" width="208" height="64" viewBox="0 0 208 64" role="img" aria-label="Русский">
  <title>Русский</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="0.35" stop-color="#c0c6cf"/>
      <stop offset="0.55" stop-color="#8a919c"/>
      <stop offset="0.8" stop-color="#dfe3e8"/>
      <stop offset="1" stop-color="#aab0ba"/>
    </linearGradient>
    <linearGradient id="metalText" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="45">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="0.38" stop-color="#c0c6cf"/>
      <stop offset="0.52" stop-color="#8a919c"/>
      <stop offset="0.78" stop-color="#dfe3e8"/>
      <stop offset="1" stop-color="#aab0ba"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b727d"/>
      <stop offset="1" stop-color="#3a3f47"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="130%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/>
      <feOffset dx="1.5" dy="2.5" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold" font-size="30">
    <!-- globe: extrusion -->
    <g transform="translate(29 33)" fill="none" stroke-linecap="round">
      <g stroke="#2b2f36" stroke-width="6" transform="translate(1.5 2)">
        <circle r="17"/>
      </g>
      <g stroke="url(#edge)" stroke-width="5.5" transform="translate(1 1.3)">
        <circle r="17"/><ellipse rx="7.5" ry="17"/><line x1="-17" y1="0" x2="17" y2="0"/>
        <path d="M-14.5 -9 Q0 -5 14.5 -9 M-14.5 9 Q0 5 14.5 9"/>
      </g>
      <g stroke="url(#metal)" stroke-width="3.6">
        <circle r="17"/><ellipse rx="7.5" ry="17"/><line x1="-17" y1="0" x2="17" y2="0"/>
        <path d="M-14.5 -9 Q0 -5 14.5 -9 M-14.5 9 Q0 5 14.5 9"/>
      </g>
      <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.1" transform="translate(-0.6 -0.8)">
        <path d="M-11 -12.5 A17 17 0 0 1 4 -16.5"/>
      </g>
    </g>
    <!-- text: dark outline / extrusion layers -->
    <text x="61.5" y="45" textLength="132" lengthAdjust="spacingAndGlyphs" fill="#2b2f36" stroke="#2b2f36" stroke-width="3" stroke-linejoin="round">Русский</text>
    <text x="60.8" y="44" textLength="132" lengthAdjust="spacingAndGlyphs" fill="url(#edge)">Русский</text>
    <text x="60" y="42.6" textLength="132" lengthAdjust="spacingAndGlyphs" fill="#ffffff" fill-opacity="0.9">Русский</text>
    <text x="60" y="43.2" textLength="132" lengthAdjust="spacingAndGlyphs" fill="url(#metalText)" stroke="#4a5059" stroke-width="0.6">Русский</text>
  </g>
</svg>
