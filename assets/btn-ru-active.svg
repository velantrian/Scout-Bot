<svg xmlns="http://www.w3.org/2000/svg" width="172" height="46" viewBox="0 0 172 46" role="img" aria-label="Русский">
  <title>Русский</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8ba0"/><stop offset="0.25" stop-color="#4a586b"/>
      <stop offset="0.6" stop-color="#2c3646"/><stop offset="1" stop-color="#1f2733"/>
    </linearGradient>
    <linearGradient id="rimOn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#d4d9e0"/>
      <stop offset="0.55" stop-color="#7f8894"/><stop offset="0.8" stop-color="#eef1f4"/><stop offset="1" stop-color="#8d95a0"/>
    </linearGradient>
    <linearGradient id="rimOff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3ae"/><stop offset="1" stop-color="#3a414b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metalText" gradientUnits="userSpaceOnUse" x1="0" y1="15" x2="0" y2="31">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.38" stop-color="#e3e7ec"/>
      <stop offset="0.52" stop-color="#8e97a3"/><stop offset="0.68" stop-color="#cfd4db"/><stop offset="1" stop-color="#f4f6f8"/>
    </linearGradient>
    <linearGradient id="flagGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lines" patternUnits="userSpaceOnUse" width="172" height="3">
      <rect width="172" height="1" fill="#ffffff" fill-opacity="0.05"/><rect y="2" width="172" height="1" fill="#000" fill-opacity="0.10"/>
    </pattern>
    <filter id="drop" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/><feOffset dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="flagClip"><rect x="14" y="13" width="30" height="20" rx="3"/></clipPath>
    <clipPath id="plate"><rect x="3" y="2" width="166" height="39" rx="12"/></clipPath>
  </defs>
  <g filter="url(#drop)">
    <rect x="3" y="2" width="166" height="39" rx="12" fill="url(#base)"/>
    <g clip-path="url(#plate)">
      <rect x="3" y="2" width="166" height="39" fill="url(#lines)"/>
      <rect x="3" y="2" width="166" height="19.5" fill="url(#gloss)"/>
    </g>
    <rect x="4.1" y="3.1" width="163.8" height="36.8" rx="10.9" fill="none" stroke="url(#rimOn)" stroke-width="2.2"/>
  </g>
  <g clip-path="url(#flagClip)">
    <g transform="translate(14 13)"><rect width="30" height="6.67" fill="#ffffff"/><rect y="6.67" width="30" height="6.67" fill="#0039A6"/><rect y="13.33" width="30" height="6.67" fill="#D52B1E"/></g>
    <rect x="14" y="13" width="30" height="10" fill="url(#flagGloss)"/>
  </g>
  <rect x="13.4" y="12.4" width="31.2" height="21.2" rx="3.4" fill="none" stroke="url(#rimOn)" stroke-width="1.2"/>
  <g font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold" font-size="18">
    <text x="54.8" y="30" textLength="92" lengthAdjust="spacingAndGlyphs" fill="#1b1f25" stroke="#1b1f25" stroke-width="2" stroke-linejoin="round">Русский</text>
    <text x="54" y="28.6" textLength="92" lengthAdjust="spacingAndGlyphs" fill="#ffffff" fill-opacity="0.85">Русский</text>
    <text x="54" y="29.2" textLength="92" lengthAdjust="spacingAndGlyphs" fill="url(#metalText)" stroke="#4a5059" stroke-width="0.4">Русский</text>
  </g>
</svg>
