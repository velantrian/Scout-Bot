<svg xmlns="http://www.w3.org/2000/svg" width="860" height="140" viewBox="0 0 860 140" role="img" aria-label="Language switcher background">
  <title>Language switcher background</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5668"/>
      <stop offset="0.18" stop-color="#2f3a49"/>
      <stop offset="0.55" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <radialGradient id="glowC" gradientUnits="userSpaceOnUse" cx="430" cy="40" r="420" gradientTransform="translate(430 40) scale(1 0.35) translate(-430 -40)">
      <stop offset="0" stop-color="#9cc2ea" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9cc2ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bevel" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="126">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#d4d9e0"/>
      <stop offset="0.48" stop-color="#7f8894"/>
      <stop offset="0.62" stop-color="#c9ced6"/>
      <stop offset="0.85" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#8d95a0"/>
    </linearGradient>
    <linearGradient id="bevelDark" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="126">
      <stop offset="0" stop-color="#6d7682"/>
      <stop offset="1" stop-color="#2a3039"/>
    </linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="740" y2="140">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.70" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.82" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plateOn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7a8f"/>
      <stop offset="0.5" stop-color="#3f4b5c"/>
      <stop offset="1" stop-color="#2a3442"/>
    </linearGradient>
    <linearGradient id="plateOff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f141b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1d2531" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c3c9d1"/>
      <stop offset="1" stop-color="#5b636e"/>
    </radialGradient>
    <pattern id="lines" patternUnits="userSpaceOnUse" x="0" y="0" width="860" height="3">
      <rect width="860" height="1" fill="#ffffff" fill-opacity="0.045"/>
      <rect y="2" width="860" height="1" fill="#000000" fill-opacity="0.10"/>
    </pattern>
    <filter id="brushed" x="0" y="0" width="860" height="140" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.9  0 0 0 0 1  0 0 0 1.4 -0.62"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="860" height="140">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="4" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="innerGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="860" height="140">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="plateGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="g"/>
      <feFlood flood-color="#bcd7f5" flood-opacity="0.45"/>
      <feComposite in2="g" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip"><rect x="8" y="10" width="844" height="116" rx="24"/></clipPath>
  </defs>
  <g filter="url(#drop)">
    <rect x="8" y="10" width="844" height="116" rx="24" fill="url(#base)"/>
  </g>
  <g clip-path="url(#panelClip)">
    <rect x="8" y="10" width="844" height="116" fill="url(#glowC)"/>
    <rect x="8" y="10" width="844" height="116" fill="#ffffff" filter="url(#brushed)" opacity="0.55"/>
    <rect x="8" y="10" width="844" height="116" fill="url(#lines)"/>
    <rect x="8" y="10" width="844" height="58.0" fill="url(#topGloss)"/>
    <rect x="14" y="16" width="832" height="104" rx="18" fill="none" stroke="#a9c8ea" stroke-opacity="0.35" stroke-width="6" filter="url(#innerGlow)"/>
    <rect x="0" y="0" width="860" height="140" fill="url(#sheen)"/>
  </g>
  <g>
      <rect x="81.0" y="26.0" width="268" height="84" rx="16" fill="url(#plateOff)"/>
      <rect x="81.5" y="26.5" width="267" height="83" rx="15.5" fill="none" stroke="#0a0d12" stroke-opacity="0.7" stroke-width="1"/>
      <path d="M97.0 109.5 H333.0" stroke="#9aa6b5" stroke-opacity="0.35" stroke-width="1"/>
    </g>
  <g>
      <rect x="511.0" y="26.0" width="268" height="84" rx="16" fill="url(#plateOff)"/>
      <rect x="511.5" y="26.5" width="267" height="83" rx="15.5" fill="none" stroke="#0a0d12" stroke-opacity="0.7" stroke-width="1"/>
      <path d="M527.0 109.5 H763.0" stroke="#9aa6b5" stroke-opacity="0.35" stroke-width="1"/>
    </g>
  <g>
    <line x1="430" y1="32" x2="430" y2="104" stroke="#0b0f14" stroke-width="3"/>
    <line x1="430" y1="32" x2="430" y2="104" stroke="url(#bevel)" stroke-width="1.4"/>
    <path d="M430 59.0 L439 68.0 L430 77.0 L421 68.0 Z" fill="url(#bevel)" stroke="#2a3038" stroke-width="0.8"/>
    <path d="M430 64.0 L434 68.0 L430 72.0 L426 68.0 Z" fill="#ffffff" fill-opacity="0.8"/>
  </g>
  <rect x="8" y="10" width="844" height="116" rx="24" fill="none" stroke="#06090d" stroke-opacity="0.6" stroke-width="1"/>
  <rect x="10.5" y="12.5" width="839" height="111" rx="21.5" fill="none" stroke="url(#bevel)" stroke-width="4"/>
  <rect x="13" y="15" width="834" height="106" rx="19" fill="none" stroke="url(#bevelDark)" stroke-width="1"/>
  <rect x="14.5" y="16.5" width="831" height="103" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
  <g transform="translate(22 24) scale(1 1)" fill="none" stroke-linecap="round">
      <path d="M0 30 L0 8 Q0 0 8 0 L30 0" stroke="#0b0f14" stroke-width="4" transform="translate(0.8 1.2)"/>
      <path d="M0 30 L0 8 Q0 0 8 0 L30 0" stroke="url(#bevel)" stroke-width="2.6"/>
      <path d="M8 22 Q8 8 22 8" stroke="url(#bevel)" stroke-width="1.4" opacity="0.85"/>
      <path d="M30 0 q6 0 6 5 q0 4 -4 4" stroke="url(#bevel)" stroke-width="1.3"/>
      <path d="M0 30 q0 6 5 6 q4 0 4 -4" stroke="url(#bevel)" stroke-width="1.3"/>
      <circle cx="13" cy="13" r="3.2" fill="url(#rivet)" stroke="#2a3038" stroke-width="0.6"/>
    </g>
  <g transform="translate(838 24) scale(-1 1)" fill="none" stroke-linecap="round">
      <path d="M0 30 L0 8 Q0 0 8 0 L30 0" stroke="#0b0f14" stroke-width="4" transform="translate(0.8 1.2)"/>
      <path d="M0 30 L0 8 Q0 0 8 0 L30 0" stroke="url(#bevel)" stroke-width="2.6"/>
      <path d="M8 22 Q8 8 22 8" stroke="url(#bevel)" stroke-width="1.4" opacity="0.85"/>
      <path d="M30 0 q6 0 6 5 q0 4 -4 4" stroke="url(#bevel)" stroke-width="1.3"/>
      <path d="M0 30 q0 6 5 6 q4 0 4 -4" stroke="url(#bevel)" stroke-width="1.3"/>
      <circle cx="13" cy="13" r="3.2" fill="url(#rivet)" stroke="#2a3038" stroke-width="0.6"/>
    </g>
  <g transform="translate(22 112) scale(1 -1)" fill="none" stroke-linecap="round">
      <path d="M0 30 L0 8 Q0 0 8 0 L30 0" stroke="#0b0f14" stroke-width="4" transform="translate(0.8 1.2)"/>
      <path d="M0 30 L0 8 Q0 0 8 0 L30 0" stroke="url(#bevel)" stroke-width="2.6"/>
      <path d="M8 22 Q8 8 22 8" stroke="url(#bevel)" stroke-width="1.4" opacity="0.85"/>
      <path d="M30 0 q6 0 6 5 q0 4 -4 4" stroke="url(#bevel)" stroke-width="1.3"/>
      <path d="M0 30 q0 6 5 6 q4 0 4 -4" stroke="url(#bevel)" stroke-width="1.3"/>
      <circle cx="13" cy="13" r="3.2" fill="url(#rivet)" stroke="#2a3038" stroke-width="0.6"/>
    </g>
  <g transform="translate(838 112) scale(-1 -1)" fill="none" stroke-linecap="round">
      <path d="M0 30 L0 8 Q0 0 8 0 L30 0" stroke="#0b0f14" stroke-width="4" transform="translate(0.8 1.2)"/>
      <path d="M0 30 L0 8 Q0 0 8 0 L30 0" stroke="url(#bevel)" stroke-width="2.6"/>
      <path d="M8 22 Q8 8 22 8" stroke="url(#bevel)" stroke-width="1.4" opacity="0.85"/>
      <path d="M30 0 q6 0 6 5 q0 4 -4 4" stroke="url(#bevel)" stroke-width="1.3"/>
      <path d="M0 30 q0 6 5 6 q4 0 4 -4" stroke="url(#bevel)" stroke-width="1.3"/>
      <circle cx="13" cy="13" r="3.2" fill="url(#rivet)" stroke="#2a3038" stroke-width="0.6"/>
    </g>
</svg>
